spring:
  application:
    name: discodeit
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

servlet:
  multipart:
    enabled: true
    max-file-size: 5MB
    max-request-size: 20MB

discodeit:
  repository:
    type: jcf   # jcf | file
    file-directory: .discodeit

springdoc:
  swagger-ui:
    path: /swagger-ui.html       # Swagger UI 접근 경로
    operations-sorter: method    # HTTP 메서드 순으로 정렬
    tags-sorter: alpha           # 태그 알파벳 순 정렬
    display-request-duration: true
  api-docs:
    path: /v3/api-docs           # OpenAPI 스펙(JSON) 경로

logging:
  level:
    com.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

server:
  port: 8080