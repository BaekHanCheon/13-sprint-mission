name: deploy

on:
  push:
    branches: [ "백한천-sprint8" ]
  workflow_dispatch:

permissions:
  contents: read # 코드 체크아웃

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  CONTAINER_NAME: discodeit-app # 작업 정의 안 컨테이너 이름과 정확히 일치해야 합니다.

jobs:
  build:
    runs-on: ubuntu-latest # Github가 빌려주는 리눅스 운영체제 러너
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7 # 내 github repository에서 코드를 가져오겠다.

      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 빌드 + 테스트
        run: |
          chmod +x gradlew 
          ./gradlew build

  deploy:
    needs: build # 순서: 빌드 + 테스트 통과 후에만 deploy가 동작한다.
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # GitHub Actions와 ECS가 모두 x86_64이므로 멀티 플랫폼 빌드를 사용하지 않습니다.
      - name: Docker 이미지 빌드 및 ECR 푸시
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}   # 커밋 해시를 태그로(어떤 코드인지 추적 가능)
        run: |
          docker build \
            -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" \
            -t "$ECR_REPOSITORY_URI:latest" \
            .

          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_URI:latest"
          
          # 다음 스텝에서 사용할 수 있도록 출력 -> GITHUB_OUTPUT에 저장
          echo "image=$ECR_REPOSITORY_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: 현재 작업 정의(task definition) 내려받기
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json
          
          # describe 응답엔 등록 불가한 읽기전용 필드가 섞여 있어 제거(jq 는 러너에 기본 설치).
          # json 안에 있는 여러가지 property 중에 읽기 전용 프로퍼티는 등록만 해도 에러가 발생하기 때문에 
          # json에서 깔끔하게 제거 -> task-definition-clean.json으로 저장 -> task-definition.json 파일에 덮어 쓰겠다.
          
          jq 'del(
            .taskDefinitionArn, .revision, .status, .requiresAttributes,
            .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection
          )' task-definition.json > task-definition-clean.json
          mv task-definition-clean.json task-definition.json

      # 작업 정의의 컨테이너 이미지를 방금 push 한 새 이미지로 교체.
      - name: 작업 정의에 새 이미지 반영
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # 프리티어 리소스를 고려해 기존 태스크를 먼저 모두 중단합니다.
      - name: 기존 ECS 서비스 중단
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 0

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      # ECS 서비스에 새 작업 정의 배포 + 안정화될 때까지 대기(무중단 롤링).
      - name: ECS 배포
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true   # 새 태스크가 안정될 때까지 기다림(성공 확인)

      # desired-count가 0인 채로 남지 않도록 새 태스크 정의 배포 후 다시 실행합니다.
      - name: 새 ECS 서비스 실행
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 1

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
